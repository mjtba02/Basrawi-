<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرات تكسي بصراوي الصغير 🚕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: #87CEEB; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* شريط المعلومات العلوي */
        #hud {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
            border-bottom: 4px solid #E65100;
        }
        .hud-badge {
            background: rgba(0,0,0,0.25);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #mission-banner {
            background: #FFF9C4;
            color: #333;
            text-align: center;
            padding: 6px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 2px solid #FBC02D;
            z-index: 9;
        }

        /* منطقة الخريطة الافتراضية */
        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #8BC34A;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* أزرار التحكم باللمس للأطفال */
        #controls {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 20;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 55px);
            gap: 6px;
            pointer-events: auto;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.85);
            border: 3px solid #006400;
            border-radius: 15px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #004d00;
            cursor: pointer;
        }
        .ctrl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #004d00;
            background: #FFEB3B;
        }
        .horn-btn {
            pointer-events: auto;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #F44336;
            color: white;
            border: 4px solid #B71C1C;
            font-size: 28px;
            box-shadow: 0 5px 0 #8E0000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .horn-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* شاشة البداية */
        #start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #006400, #2E7D32);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .play-btn {
            background: #FFEB3B;
            color: #004d00;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            box-shadow: 0 6px 0 #FBC02D;
            cursor: pointer;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <!-- شاشة البداية الكرتونية -->
    <div id="start-screen">
        <div style="font-size: 80px; margin-bottom: 10px;">🚕🌴</div>
        <h1 style="font-size: 28px; margin-bottom: 10px;">مغامرات تكسي بصراوي الصغير</h1>
        <p style="font-size: 16px; max-width: 320px; line-height: 1.5; opacity: 0.9;">
            سُق التكسي في شوارع البصرة الحلوة، اصعد الركاب، ووصلهم لأماكنهم واجمع النجوم! ⭐
        </p>
        <button class="play-btn" onclick="startGame()">يلا نلعب! 🚀</button>
    </div>

    <!-- الشريط العلوي -->
    <div id="hud">
        <div class="hud-badge">⭐ النجوم: <span id="score">0</span></div>
        <div class="hud-badge">🚕 الركاب: <span id="passengers-count">0</span></div>
        <div class="hud-badge">🏆 المستوى: <span id="level">1</span></div>
    </div>

    <!-- شريط المهمة الحالية -->
    <div id="mission-banner">ابحث عن الراكب الذي يلوّح بيده! 👋</div>

    <!-- الخريطة الافتراضية -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- أزرار التحكم -->
        <div id="controls">
            <button class="horn-btn" onclick="playHorn()">📣</button>
            <div class="d-pad">
                <div></div>
                <button class="ctrl-btn" id="btn-up">⬆️</button>
                <div></div>
                <button class="ctrl-btn" id="btn-right">➡️</button>
                <button class="ctrl-btn" id="btn-down">⬇️</button>
                <button class="ctrl-btn" id="btn-left">⬅️</button>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // إعداد الصوت الكرتوني المدمج (بدون ملفات خارجية)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playHorn() {
            playTone(350, 'sawtooth', 0.15);
            setTimeout(() => playTone(440, 'sawtooth', 0.25), 160);
        }

        function playPickupSound() {
            playTone(523.25, 'sine', 0.1);
            setTimeout(() => playTone(659.25, 'sine', 0.1), 100);
            setTimeout(() => playTone(783.99, 'sine', 0.2), 200);
        }

        function playDropoffSound() {
            playTone(587.33, 'triangle', 0.1);
            setTimeout(() => playTone(880, 'triangle', 0.3), 120);
        }

        // متغيرات اللعبة
        let gameStarted = false;
        let score = 0;
        let deliveredCount = 0;
        let level = 1;

        // التكسي
        const taxi = {
            x: 150,
            y: 150,
            width: 44,
            height: 28,
            speed: 4,
            angle: 0,
            hasPassenger: false,
            passengerEmoji: '👦'
        };

        // المعالم البصرية في الخريطة الافتراضية
        const landmarks = [
            { name: 'العشار 🕌', x: 0.2, y: 0.25, color: '#FFCC80' },
            { name: 'الجزائر 🎡', x: 0.8, y: 0.25, color: '#CE93D8' },
            { name: 'جامعة البصرة 🎓', x: 0.2, y: 0.75, color: '#90CAF9' },
            { name: 'المعقل ⚓', x: 0.8, y: 0.75, color: '#A5D6A7' }
        ];

        const passengerEmojis = ['👦', '👧', '👴', '👵', '🧑‍🎓', '👮‍♂️'];
        
        // كائن الراكب والوجهة
        let target = {
            x: 300,
            y: 300,
            type: 'pickup', // 'pickup' أو 'dropoff'
            landmarkName: ''
        };

        // النجوم الإضافية
        let stars = [];
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnTarget() {
            if (!taxi.hasPassenger) {
                // توليد راكب في مكان عشوائي على الطرق
                target.type = 'pickup';
                taxi.passengerEmoji = passengerEmojis[Math.floor(Math.random() * passengerEmojis.length)];
                target.x = 60 + Math.random() * (canvas.width - 120);
                target.y = 60 + Math.random() * (canvas.height - 180);
                document.getElementById('mission-banner').innerHTML = `اصعد الراكب ${taxi.passengerEmoji} اللي يأشرلك! 👋`;
            } else {
                // اختيار معلم من معالم البصرة كوجهة
                target.type = 'dropoff';
                const lm = landmarks[Math.floor(Math.random() * landmarks.length)];
                target.x = lm.x * canvas.width;
                target.y = lm.y * canvas.height;
                target.landmarkName = lm.name;
                document.getElementById('mission-banner').innerHTML = `وصّل ${taxi.passengerEmoji} إلى: <span style="color:#D84315">${lm.name}</span> 🏁`;
            }
        }

        function spawnStars() {
            stars = [];
            for (let i = 0; i < 4; i++) {
                stars.push({
                    x: 50 + Math.random() * (canvas.width - 100),
                    y: 50 + Math.random() * (canvas.height - 160),
                    collected: false
                });
            }
        }

        function drawMap() {
            // العشب الأخضر
            ctx.fillStyle = '#8BC34A';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // شط العرب (نهر أزرق جميل أسفل الشاشة)
            ctx.fillStyle = '#29B6F6';
            ctx.fillRect(0, canvas.height - 65, canvas.width, 65);
            
            // أمواج ناعمة في شط العرب
            ctx.fillStyle = '#81D4FA';
            for (let i = 20; i < canvas.width; i += 80) {
                ctx.fillRect(i, canvas.height - 45, 35, 5);
                ctx.fillRect(i + 20, canvas.height - 25, 35, 5);
            }

            // شبكة الشوارع الافتراضية
            ctx.fillStyle = '#546E7A';
            const roadWidth = 55;
            // شارع أفقي علوي وسفلي
            ctx.fillRect(0, canvas.height * 0.25 - roadWidth/2, canvas.width, roadWidth);
            ctx.fillRect(0, canvas.height * 0.75 - roadWidth/2, canvas.width, roadWidth);
            // شارع عمودي أيمن وأيسر
            ctx.fillRect(canvas.width * 0.2 - roadWidth/2, 0, roadWidth, canvas.height - 65);
            ctx.fillRect(canvas.width * 0.8 - roadWidth/2, 0, roadWidth, canvas.height - 65);
            // شارع وسطي
            ctx.fillRect(0, canvas.height * 0.5 - roadWidth/2, canvas.width, roadWidth);

            // تخطيط الشوارع (الخطوط البيضاء المتقطعة)
            ctx.strokeStyle = '#FFFFFF';
            ctx.setLineDash([15, 15]);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.25); ctx.lineTo(canvas.width, canvas.height * 0.25);
            ctx.moveTo(0, canvas.height * 0.5); ctx.lineTo(canvas.width, canvas.height * 0.5);
            ctx.moveTo(0, canvas.height * 0.75); ctx.lineTo(canvas.width, canvas.height * 0.75);
            ctx.moveTo(canvas.width * 0.2, 0); ctx.lineTo(canvas.width * 0.2, canvas.height - 65);
            ctx.moveTo(canvas.width * 0.8, 0); ctx.lineTo(canvas.width * 0.8, canvas.height - 65);
            ctx.stroke();
            ctx.setLineDash([]);

            // رسم أشجار النخيل البصرية للزينة
            ctx.font = '28px Arial';
            ctx.fillText('🌴', canvas.width * 0.5 - 15, canvas.height * 0.15);
            ctx.fillText('🌴', canvas.width * 0.5 - 15, canvas.height * 0.38);
            ctx.fillText('🌴', canvas.width * 0.5 - 15, canvas.height * 0.63);
            ctx.fillText('⛵', canvas.width * 0.3, canvas.height - 20);
            ctx.fillText('⛵', canvas.width * 0.7, canvas.height - 20);

            // رسم مناطق البصرة (المعالم)
            landmarks.forEach(lm => {
                const lx = lm.x * canvas.width;
                const ly = lm.y * canvas.height;
                ctx.fillStyle = lm.color;
                ctx.beginPath();
                ctx.roundRect(lx - 45, ly - 45, 90, 30, 10);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(lm.name, lx, ly - 25);
            });
        }

        function drawEntities() {
            // رسم النجوم
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            stars.forEach(s => {
                if (!s.collected) {
                    ctx.fillText('⭐', s.x, s.y + 8);
                }
            });

            // رسم الهدف (راكب أو نقطة وصول)
            const pulse = Math.sin(Date.now() / 200) * 6;
            ctx.beginPath();
            ctx.arc(target.x, target.y, 26 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = target.type === 'pickup' ? 'rgba(76, 175, 80, 0.4)' : 'rgba(244, 67, 54, 0.4)';
            ctx.fill();

            ctx.font = '32px Arial';
            if (target.type === 'pickup') {
                ctx.fillText(taxi.passengerEmoji, target.x, target.y + 10);
            } else {
                ctx.fillText('🏁', target.x, target.y + 10);
            }

            // رسم تكسي بصراوي الأصفر الكرتوني
            ctx.save();
            ctx.translate(taxi.x, taxi.y);
            ctx.rotate(taxi.angle);

            // جسم السيارة
            ctx.fillStyle = '#FFD600';
            ctx.beginPath();
            ctx.roundRect(-taxi.width/2, -taxi.height/2, taxi.width, taxi.height, 8);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#E65100';
            ctx.stroke();

            // زجاج السيارة
            ctx.fillStyle = '#81D4FA';
            ctx.fillRect(-5, -taxi.height/2 + 4, 14, taxi.height - 8);

            // علامة التاكسي على السقف
            ctx.fillStyle = '#FFF';
            ctx.fillRect(-10, -6, 8, 12);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 7px Arial';
            ctx.fillText('TAXI', -6, 2);

            // إظهار الراكب بداخل السيارة
            if (taxi.hasPassenger) {
                ctx.font = '16px Arial';
                ctx.fillText(taxi.passengerEmoji, 2, 5);
            }

            ctx.restore();
        }
        // حالة أزرار الحركة
        const keys = { up: false, down: false, left: false, right: false };

        function setupButton(id, dir) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[dir] = false; });
            btn.addEventListener('mousedown', () => keys[dir] = true);
            btn.addEventListener('mouseup', () => keys[dir] = false);
            btn.addEventListener('mouseleave', () => keys[dir] = false);
        }

        setupButton('btn-up', 'up');
        setupButton('btn-down', 'down');
        setupButton('btn-left', 'left');
        setupButton('btn-right', 'right');

        // دعم الكيبورد أيضاً
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === ' ') playHorn();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        function update() {
            if (!gameStarted) return;

            let dx = 0;
            let dy = 0;

            if (keys.up) dy -= taxi.speed;
            if (keys.down) dy += taxi.speed;
            if (keys.left) dx -= taxi.speed;
            if (keys.right) dx += taxi.speed;

            if (dx !== 0 || dy !== 0) {
                taxi.x += dx;
                taxi.y += dy;
                taxi.angle = Math.atan2(dy, dx);
            }

            // منع الخروج عن حدود الشاشة أو السقوط في شط العرب
            taxi.x = Math.max(25, Math.min(canvas.width - 25, taxi.x));
            taxi.y = Math.max(25, Math.min(canvas.height - 80, taxi.y));

            // التحقق من جمع النجوم
            stars.forEach(s => {
                if (!s.collected && Math.hypot(taxi.x - s.x, taxi.y - s.y) < 35) {
                    s.collected = true;
                    score += 10;
                    document.getElementById('score').innerText = score;
                    playTone(900, 'sine', 0.15);
                }
            });

            // التحقق من الوصول للراكب أو الوجهة
            const dist = Math.hypot(taxi.x - target.x, taxi.y - target.y);
            if (dist < 40) {
                if (target.type === 'pickup') {
                    taxi.hasPassenger = true;
                    playPickupSound();
                    spawnTarget();
                } else {
                    taxi.hasPassenger = false;
                    deliveredCount++;
                    score += 50;
                    if (deliveredCount % 3 === 0) {
                        level++;
                        taxi.speed += 0.5;
                        document.getElementById('level').innerText = level;
                    }
                    document.getElementById('passengers-count').innerText = deliveredCount;
                    document.getElementById('score').innerText = score;
                    playDropoffSound();
                    spawnStars();
                    spawnTarget();
                }
            }
        }

        function gameLoop() {
            drawMap();
            update();
            drawEntities();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameStarted = true;
            taxi.x = canvas.width * 0.2;
            taxi.y = canvas.height * 0.5;
            spawnStars();
            spawnTarget();
            playHorn();
            gameLoop();
        }
    </script>
</body>
</html>
